name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test_and_build:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/tradeverse_test
      JWT_ACCESS_SECRET: tradeverse_test_jwt_access_secret_key_32_chars_minimum!
      JWT_REFRESH_SECRET: tradeverse_test_jwt_refresh_secret_key_32_chars_minimum!
      CORS_ORIGINS: "*"
      ALPHA_VANTAGE_API_KEY: demo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            packages/shared/api-contracts/package-lock.json
            apps/api/package-lock.json

      - name: Build Shared Contracts
        working-directory: packages/shared/api-contracts
        run: |
          npm ci
          npm run build

      - name: Install Backend Dependencies
        working-directory: apps/api
        run: npm ci

      - name: Type Check & Build
        working-directory: apps/api
        run: npm run build

      - name: Run Backend Tests
        working-directory: apps/api
        run: npm test
