name: Flutter Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter-android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter-android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Publish Debug APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-debug -y || true
          git tag -d v1.0.0-debug || true
          gh release create v1.0.0-debug build/app/outputs/flutter-apk/app-debug.apk \
            --title "TradeVerse Android Debug Build" \
            --notes "Automated debug APK build from commit ${{ github.sha }}" \
            --prerelease
